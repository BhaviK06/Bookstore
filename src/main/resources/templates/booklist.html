<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Server Programming</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet"
      href="/css/bootstrap.min.css"
      th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1>Book list</h1>
    <div>
        Signed in as <strong th:text="${username}"></strong>
        <form th:action="@{/logout}" method="post" style="display: inline">
            <button type="submit" class="btn btn-secondary">Logout</button>
        </form>
    </div>
    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Publication year</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.category != null ? book.category.name : ''}"></td>
            <td>
                <form th:if="${isAdmin}" th:action="@{/delete/{id}(id=${book.id})}" method="post"
                      style="display: inline">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
                <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-primary">Edit</a>
            </td>
        </tr>
    </table>

    <a href="/add" class="btn btn-success">Add book</a>

</body>

</html>
